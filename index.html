<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MarkSelling — Analizza il tuo processo di vendita</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      /* === MARKSELLING DARK SYSTEM === */
      --bg:#000000;
      --bg2:#050505;
      --card:rgba(10,10,10,.78);
      --card2:rgba(255,255,255,.03);

      --text:#ffffff;
      --muted:rgba(255,255,255,.72);
      --muted2:rgba(255,255,255,.55);

      --border:rgba(255,255,255,.12);
      --border2:rgba(34,197,94,.28);

      --shadow:0 20px 70px rgba(0,0,0,.55);

      /* CTA Rosso */
      --red:#DC2626;
      --redHover:#EF4444;
      --redActive:#B91C1C;

      /* Sistema Verde */
      --green:#22C55E;
      --green2:#16A34A;

      /* Error */
      --danger:#EF4444;
      --dangerBg:rgba(239,68,68,.10);
      --dangerBd:rgba(239,68,68,.28);

      --radius:22px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 420px at 12% 10%, rgba(220,38,38,.18), transparent 62%),
        radial-gradient(900px 420px at 88% 12%, rgba(34,197,94,.14), transparent 60%),
        radial-gradient(1200px 520px at 50% 0%, rgba(255,255,255,.05), transparent 55%),
        linear-gradient(180deg, var(--bg2), var(--bg));
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:34px 18px 56px;
    }

    /* Header */
    .topbar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .kicker{
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:900;
      color:rgba(255,255,255,.55);
    }
    .h1{
      font-size:38px;
      line-height:1.05;
      margin:0;
      font-weight:900;
      letter-spacing:-.02em;
    }
    .h1 span{
      color:rgba(255,255,255,.95);
    }

    .top-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    /* Small buttons (top right) */
    .btn{
      appearance:none;
      border:1px solid var(--border);
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.90);
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow:0 12px 28px rgba(0,0,0,.35);
      transition:transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .btn:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
    }
    .btn:active{ transform:translateY(0); }

    /* Progress */
    .progress{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      border-radius:18px;
      padding:14px;
      box-shadow:0 14px 40px rgba(0,0,0,.45);
      margin:12px 0 16px;
    }
    .prog-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .prog-label{
      font-size:13px;
      font-weight:900;
      color:rgba(255,255,255,.82);
    }
    .prog-pct{
      font-size:13px;
      font-weight:900;
      color:rgba(255,255,255,.58);
    }
    .bar{
      width:100%;
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      overflow:hidden;
    }
    .bar > div{
      height:100%;
      width:0%;
      border-radius:999px;
      background: linear-gradient(135deg, var(--green), var(--green2));
      box-shadow:0 0 18px rgba(34,197,94,.28);
      transition:width .25s ease;
    }

    /* Card */
    .card{
      border:1px solid rgba(34,197,94,.18);
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(700px 220px at 20% 0%, rgba(220,38,38,.14), transparent 60%),
        radial-gradient(700px 220px at 80% 10%, rgba(34,197,94,.12), transparent 60%);
      opacity:.55;
      pointer-events:none;
    }
    .card > *{ position:relative; z-index:2; }

    .q{
      font-size:20px;
      font-weight:900;
      margin:0 0 8px 0;
      letter-spacing:-.01em;
    }
    .sub{
      margin:0 0 14px 0;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
      font-weight:500;
    }

    /* Fields */
    .ms-field{
      width:100%;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.16);
      outline:none;
      font-size:15px;
      font-weight:700;
      background:rgba(0,0,0,.55);
      color:rgba(255,255,255,.92);
      box-shadow:0 10px 26px rgba(0,0,0,.35);
    }
    .ms-field::placeholder{
      color:rgba(255,255,255,.42);
      font-weight:700;
    }
    .ms-field:focus{
      border-color:rgba(34,197,94,.55);
      box-shadow:0 0 0 5px rgba(34,197,94,.14), 0 12px 30px rgba(0,0,0,.35);
    }
    .ms-hint{
      margin-top:10px;
      font-size:12px;
      color:rgba(255,255,255,.62);
      line-height:1.45;
      font-weight:600;
    }

    /* Error + Saved */
    .err{
      display:none;
      margin-top:12px;
      border:1px solid var(--dangerBd);
      background:var(--dangerBg);
      color:rgba(255,255,255,.92);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      font-size:12px;
    }
    .saved{
      display:none;
      position:fixed;
      right:14px;
      top:14px;
      z-index:9999;
      background:#0b0b0b;
      color:#fff;
      border:1px solid rgba(34,197,94,.28);
      padding:10px 12px;
      border-radius:14px;
      font-weight:900;
      font-size:12px;
      box-shadow:0 16px 40px rgba(0,0,0,.55);
    }

    /* Nav */
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    .nav-left,.nav-right{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn-outline{
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.90);
      border-radius:16px;
      padding:12px 16px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:44px;
      transition:transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .btn-outline:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,.22);
      background:rgba(255,255,255,.06);
    }
    .btn-outline:active{ transform:translateY(0); }

    .btn-primary{
      border:none;
      color:#fff;
      border-radius:16px;
      padding:12px 18px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:44px;
      background: linear-gradient(135deg, var(--red), #F05252);
      box-shadow: 0 18px 42px rgba(220,38,38,.30);
      transition:transform .15s ease, filter .15s ease;
    }
    .btn-primary:hover{
      transform:translateY(-1px);
      filter:saturate(1.05) brightness(1.05);
    }
    .btn-primary:active{
      transform:translateY(0);
      filter:saturate(1.0) brightness(.98);
    }

    @media (max-width:640px){
      .h1{ font-size:30px; }
      .card{ padding:16px; }
      .nav{ flex-direction:column; align-items:stretch; }
      .nav-left,.nav-right{ width:100%; justify-content:space-between; }
      .btn-outline,.btn-primary{ width:100%; justify-content:center; }
    }
  </style>
</head>

<body>
  <!-- anchor per scrollToTopForm() -->
  <div id="ms_top"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="kicker">MARKSELLING — ANALISI</div>
        <h1 class="h1">Analizza il tuo <span>processo di vendita</span></h1>
      </div>

      <div class="top-actions">
        <button class="btn" type="button" onclick="MS_TF.next()">
          <span>Vai ai risultati</span>
        </button>

        <button class="btn" type="button" onclick="MS_TF.reset()">
          <span>Azzera</span>
        </button>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress" id="ms_progress_wrap">
      <div class="prog-row">
        <div class="prog-label" id="ms_prog_label">Domanda 1 di 1</div>
        <div class="prog-pct" id="ms_prog_pct">0%</div>
      </div>
      <div class="bar" aria-hidden="true">
        <div id="ms_prog_bar"></div>
      </div>
    </div>

    <!-- CARD -->
    <div class="card">
      <h2 class="q" id="ms_step_question">—</h2>
      <p class="sub" id="ms_step_sub">—</p>

      <div id="ms_step_body"></div>

      <div class="err" id="ms_err">Compila la risposta per continuare.</div>
    </div>

    <!-- NAV -->
    <div class="nav" id="ms_nav">
      <div class="nav-left">
        <button class="btn-outline" id="ms_back_btn" type="button" onclick="MS_TF.back()">← Indietro</button>
      </div>
      <div class="nav-right">
        <button class="btn-primary" id="ms_next_btn" type="button" onclick="MS_TF.next()">Avanti →</button>
      </div>
    </div>
  </div>

  <!-- toast “salvato” -->
  <div class="saved" id="ms_saved">Salvato ✓</div>

  <!-- ✅ CARICO IL TUO APP.JS -->
  <script src="app.js" defer></script>
</body>
</html>
