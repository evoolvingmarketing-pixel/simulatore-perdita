<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MarkSelling — Simulatore Spreco ADV & Fatturato Perso</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#0b1220;
      --muted:rgba(11,18,32,.72);
      --border:rgba(11,18,32,.12);
      --shadow:0 16px 50px rgba(11,18,32,.10);
      --accent:#2563eb;
      --accent2:#4f46e5;
      --danger:#b91c1c;
      --dangerBg:rgba(239,68,68,.08);
      --dangerBd:rgba(239,68,68,.28);
      --radius:22px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      color:var(--text);
      background: radial-gradient(1100px 420px at 10% 0%, rgba(37,99,235,.10), transparent 60%),
                  radial-gradient(900px 380px at 90% 10%, rgba(79,70,229,.10), transparent 55%),
                  var(--bg);
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:34px 18px 56px;
    }

    /* Header */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .kicker{
      font-size:12px;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-weight:900;
      color:rgba(11,18,32,.55);
    }
    .h1{
      font-size:34px;
      line-height:1.05;
      margin:0;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .top-actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .btn{
      appearance:none;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow:0 10px 24px rgba(11,18,32,.06);
    }
    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0); }

    /* Progress */
    .progress{
      border:1px solid var(--border);
      background:rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
      border-radius:18px;
      padding:14px;
      box-shadow:0 12px 34px rgba(11,18,32,.08);
      margin:12px 0 16px;
    }
    .prog-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .prog-label{
      font-size:13px;
      font-weight:900;
      color:rgba(11,18,32,.78);
    }
    .prog-pct{
      font-size:13px;
      font-weight:900;
      color:rgba(11,18,32,.62);
    }
    .bar{
      width:100%;
      height:10px;
      border-radius:999px;
      background:rgba(11,18,32,.10);
      overflow:hidden;
    }
    .bar > div{
      height:100%;
      width:0%;
      border-radius:999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      transition:width .25s ease;
    }

    /* Card */
    .card{
      border:1px solid var(--border);
      background:var(--card);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:var(--shadow);
    }
    .q{
      font-size:18px;
      font-weight:900;
      margin:0 0 8px 0;
      letter-spacing:-.01em;
    }
    .sub{
      margin:0 0 14px 0;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
      font-weight:500;
    }

    /* Fields */
    .ms-field{
      width:100%;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(11,18,32,.16);
      outline:none;
      font-size:15px;
      font-weight:700;
      background:#fff;
    }
    .ms-field:focus{
      border-color:rgba(37,99,235,.45);
      box-shadow:0 0 0 5px rgba(37,99,235,.12);
    }
    .ms-hint{
      margin-top:10px;
      font-size:12px;
      color:rgba(11,18,32,.68);
      line-height:1.45;
      font-weight:600;
    }

    /* Error + Saved */
    .err{
      display:none;
      margin-top:12px;
      border:1px solid var(--dangerBd);
      background:var(--dangerBg);
      color:var(--danger);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      font-size:12px;
    }
    .saved{
      display:none;
      position:fixed;
      right:14px;
      top:14px;
      z-index:9999;
      background:#111827;
      color:#fff;
      border:1px solid rgba(255,255,255,.14);
      padding:10px 12px;
      border-radius:14px;
      font-weight:900;
      font-size:12px;
      box-shadow:0 16px 40px rgba(0,0,0,.25);
    }

    /* Nav */
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    .nav-left,.nav-right{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btn-outline{
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      border-radius:16px;
      padding:12px 16px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:44px;
    }

    .btn-primary{
      border:none;
      color:#fff;
      border-radius:16px;
      padding:12px 18px;
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:10px;
      min-height:44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 18px 42px rgba(37,99,235,.28);
    }

    @media (max-width:640px){
      .h1{ font-size:28px; }
      .card{ padding:16px; }
      .nav{ flex-direction:column; align-items:stretch; }
      .nav-left,.nav-right{ width:100%; justify-content:space-between; }
      .btn-outline,.btn-primary{ width:100%; justify-content:center; }
    }
  </style>
</head>

<body>
  <!-- anchor per scrollToTopForm() -->
  <div id="ms_top"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="kicker">MARKSELLING — SIMULATORE</div>
        <h1 class="h1">Spreco ADV &amp; fatturato perso</h1>
      </div>

      <div class="top-actions">
        <!-- (Se vuoi riusare “Risultati mensili” come bottone rapido, lo lascio ma non serve) -->
        <button class="btn" type="button" onclick="MS_TF.next()">
          <span>Risultati mensili</span>
        </button>

        <button class="btn" type="button" onclick="MS_TF.reset()">
          <span>Azzera</span>
        </button>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress" id="ms_progress_wrap">
      <div class="prog-row">
        <div class="prog-label" id="ms_prog_label">Domanda 1 di 1</div>
        <div class="prog-pct" id="ms_prog_pct">0%</div>
      </div>
      <div class="bar" aria-hidden="true">
        <div id="ms_prog_bar"></div>
      </div>
    </div>

    <!-- CARD -->
    <div class="card">
      <h2 class="q" id="ms_step_question">—</h2>
      <p class="sub" id="ms_step_sub">—</p>

      <div id="ms_step_body"></div>

      <div class="err" id="ms_err">Compila la risposta per continuare.</div>
    </div>

    <!-- NAV -->
    <div class="nav" id="ms_nav">
      <div class="nav-left">
        <button class="btn-outline" id="ms_back_btn" type="button" onclick="MS_TF.back()">← Indietro</button>
      </div>
      <div class="nav-right">
        <button class="btn-primary" id="ms_next_btn" type="button" onclick="MS_TF.next()">Avanti →</button>
      </div>
    </div>
  </div>

  <!-- toast “salvato” -->
  <div class="saved" id="ms_saved">Salvato ✓</div>

  <!-- ✅ CARICO IL TUO APP.JS -->
  <script src="app.js" defer></script>
</body>
</html>
